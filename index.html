<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Rata Credit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Calculator Rata Credit</h1>
        <form id="loan-form">
            <div class="form-group">
                <label for="amount">Suma dorita (RON):</label>
                <input type="number" id="amount" placeholder="Ex: 50000" required min="1">
            </div>

            <div class="form-group">
                <label for="period">Perioada (Luni):</label>
                <input type="number" id="period" placeholder="Ex: 60" required min="1">
            </div>

            <div class="form-group">
                <label for="interest">Dobanda Anuala (%):</label>
                <input type="number" id="interest" placeholder="Ex: 8.5" step="0.01" required min="0">
            </div>

            <button type="submit" class="btn">Calculeaza</button>
        </form>

        <div id="results" class="results-container" style="display: none;">
            <h2>Rezultate</h2>
            <div class="result-group">
                <p>Rata lunara:</p>
                <h3 id="monthly-payment">0 RON</h3>
            </div>
            <div class="result-group">
                <p>Total de plata:</p>
                <h3 id="total-payment">0 RON</h3>
            </div>
            <div class="result-group">
                <p>Total dobanda platita:</p>
                <h3 id="total-interest">0 RON</h3>
            </div>
        </div>

        <div id="schedule-container" class="schedule-container" style="display: none;">
            <h2>Grafic de rambursare</h2>
            <div class="table-responsive">
                <table id="amortization-table">
                    <thead>
                        <tr>
                            <th>Luna</th>
                            <th>Rata lunara</th>
                            <th>Principal</th>
                            <th>Dobanda</th>
                            <th>Sold ramas</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Schedule rows will go here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
